<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Faster Flutter mark. Two ink strokes with a gap between them (the two
       sides of a bridge), and one straight green bolt that crosses the gap and
       closes it. The white outline under the bolt cuts the strokes cleanly so
       the shapes stay apart at 48 px. Original; no Flutter or Dart logo. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <rect x="132" y="440" width="304" height="144" rx="72" fill="#20344B"/>
  <rect x="588" y="440" width="304" height="144" rx="72" fill="#20344B"/>
  <line x1="376" y1="800" x2="648" y2="224" stroke="#FFFFFF" stroke-width="208" stroke-linecap="round"/>
  <line x1="376" y1="800" x2="648" y2="224" stroke="#34A853" stroke-width="144" stroke-linecap="round"/>
</svg>
