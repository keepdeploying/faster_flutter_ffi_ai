<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android adaptive icon foreground: the same mark on a transparent
       canvas, scaled to 0.80 so every point stays inside the 66 dp safe circle
       (radius 312 of 512, 61% of the 108 dp canvas). The background layer is white. -->
  <g transform="translate(512 512) scale(0.80) translate(-512 -512)">
    <rect x="132" y="440" width="304" height="144" rx="72" fill="#20344B"/>
    <rect x="588" y="440" width="304" height="144" rx="72" fill="#20344B"/>
    <line x1="376" y1="800" x2="648" y2="224" stroke="#FFFFFF" stroke-width="208" stroke-linecap="round"/>
    <line x1="376" y1="800" x2="648" y2="224" stroke="#34A853" stroke-width="144" stroke-linecap="round"/>
  </g>
</svg>
