# The exclude list is the one the Flutter tool writes itself when platform
# folders exist. Committing it in full stops `flutter pub get` from editing
# this file after a fresh clone, so `git status` stays clean.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - linux/**
    - macos/**
    - windows/**
include: package:flutter_lints/flutter.yaml
