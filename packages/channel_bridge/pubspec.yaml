name: channel_bridge
description: >-
  Platform-channel side of the "Faster Flutter" demo: a MethodChannel and a
  BinaryCodec channel that move bytes to Kotlin and Swift, and a LiteRT image
  classifier behind the same channel.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.obumnwabude.channel_bridge
        pluginClass: ChannelBridgePlugin
      ios:
        pluginClass: ChannelBridgePlugin
