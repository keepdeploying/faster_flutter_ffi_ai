name: llm_bridge
description: >-
  llama.cpp for Dart over dart:ffi: a native worker thread streams tokens to
  Dart with NativeCallable.listener. Built by a build hook from a pinned commit.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  # The only runtime dependency: malloc, Utf8 and string conversion for dart:ffi.
  ffi: ^2.1.4
  # The two packages every build hook uses: the hook protocol and code assets.
  hooks: ^2.0.0
  code_assets: ^2.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0
