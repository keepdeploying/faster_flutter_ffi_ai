name: ffi_bridge
description: >-
  Dart FFI bridge for the "Faster Flutter" demo: C checksum, image
  preprocessing and a native token stream, built by a build hook.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  # Pointer helpers (Utf8.toDartString) for reading token strings from C.
  ffi: ^2.1.4
  # Build hook: compiles src/ffi_bridge.c on every platform, no CMake/podspec.
  code_assets: ^2.1.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  # Regenerates lib/ffi_bridge_bindings_generated.dart (see ffigen.yaml).
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
